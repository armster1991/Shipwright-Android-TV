
###############################################################################
# Workflow de build para a branch v1.3.0-with-fixes (estrutura antiga,
# projeto Android puro na raiz do repositório, sem pipeline Docker/CMake
# multi-submódulo que a branch main mais nova usa).
###############################################################################

name: Project Build (v1.3.0 base)

###############################################################################

on:
  workflow_dispatch:
  push:
    branches: [v1.3.0-with-fixes]
  pull_request:
    types: [opened, synchronize]

###############################################################################

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.0.10792818"
          sdkmanager --install "cmake;3.31.5"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.0.10792818

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soh-v1.3.0-firestick-fix
          path: |
            app/build/outputs/apk/release/*.apk

###############################################################################
